[project]
name = "dapur-aman-backend"
version = "0.1.0"
description = "Dapur Aman backend: FastAPI app and Google ADK agents"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.43.116",
    "fastapi>=0.141.1",
    "google-adk>=2.12.0",
    "litellm>=1.106.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]
